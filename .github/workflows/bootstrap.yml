name: Bootstrap TechBiz Source
on:
  push:
    paths:
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild source archive
        shell: bash
        run: |
          cat .bootstrap/chunk1.txt .bootstrap/chunk2.txt .bootstrap/chunk3.txt .bootstrap/chunk4.txt .bootstrap/chunk5.txt | base64 -d > /tmp/techbiz.zip
          mkdir -p /tmp/techbiz-src
          unzip -q /tmp/techbiz.zip -d /tmp/techbiz-src
          cp -a /tmp/techbiz-src/. .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
      - name: Commit imported source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import TechBiz Business Management System v2 source"
          git push
