name: Temporary production E2E patch

on:
  push:
    branches: [main]
    paths:
      - '.e2e_temp.pyfrag'
      - '.e2e_cleanup'

permissions:
  contents: write

jobs:
  patch-or-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply temporary E2E patch
        if: hashFiles('.e2e_cleanup') == ''
        run: |
          cat .e2e_temp.pyfrag >> main.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py
          git commit -m "Temporary production E2E self-test"
          git push
      - name: Restore canonical v2.3 and remove temporary files
        if: hashFiles('.e2e_cleanup') != ''
        run: |
          git checkout 2eabbb9f25d20ab1d80621c4001a886c73eb292f -- main.py
          git rm -f .e2e_temp.pyfrag .e2e_cleanup .github/workflows/temp-production-e2e.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py
          git commit -m "Remove temporary E2E self-test and restore canonical v2.3"
          git push
